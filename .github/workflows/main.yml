name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: skillbarter_user
          POSTGRES_PASSWORD: skillbarter_pass
          POSTGRES_DB: skillbarter_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    
    - name: Run tests
      working-directory: backend
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/skillbarter_test
        SPRING_DATASOURCE_USERNAME: skillbarter_user
        SPRING_DATASOURCE_PASSWORD: skillbarter_pass
        SPRING_REDIS_HOST: localhost
        SPRING_REDIS_PORT: 6379
      run: |
        mvn clean test
    
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests
        path: backend/target/surefire-reports/*.xml
        reporter: java-junit

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      working-directory: backend
      run: mvn clean package -DskipTests
    
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v3
      with:
        name: backend-jar
        path: backend/target/*.jar
        retention-days: 7

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/skill-barter-web/package-lock.json
    
    - name: Install dependencies
      working-directory: frontend/skill-barter-web
      run: npm ci
    
    - name: Lint
      working-directory: frontend/skill-barter-web
      run: npm run lint
      continue-on-error: true
    
    - name: Run tests
      working-directory: frontend/skill-barter-web
      run: npm run test -- --watch=false --browsers=ChromeHeadless
      continue-on-error: true
    
    - name: Build
      working-directory: frontend/skill-barter-web
      run: npm run build -- --configuration=production

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Backend Docker Image
      run: |
        docker build -t skill-barter-backend:latest ./backend
      continue-on-error: true
    
    - name: Build Frontend Docker Image  
      run: |
        docker build -t skill-barter-frontend:latest ./frontend
      continue-on-error: true
